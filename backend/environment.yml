name: swpp-backend
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.3.3
  - opencv
  - pillow
  - ninja
  - pip
  - pip:
    # PyTorch with CUDA support
    - --index-url https://download.pytorch.org/whl/cu129
    - --extra-index-url https://pypi.org/simple
    - torch==2.8.0
    - torchvision==0.23.0
    - torchaudio==2.8.0
    - cuda-python==12.9

    # ML/AI libraries
    - transformers==4.51.3
    - tokenizers
    - datasets
    - peft
    - accelerate
    - bitsandbytes
    - safetensors
    - kokoro==0.9.4
    - soundfile
    - librosa
    - 'nemo_toolkit[asr]==2.4.1'
    - openpyxl
    - pymupdf
    - tqdm

    # Backend/API libraries
    - aiofiles==25.1.0
    - annotated-types==0.7.0
    - anyio==4.11.0
    - certifi==2025.10.5
    - click==8.3.0
