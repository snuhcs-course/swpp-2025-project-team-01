name: CI

on:
  push:
    branches: [ main, frontend ]
  pull_request:
    branches: [ main, frontend ]

jobs:
  build:
    # Build only on pushes to main or PRs whose base is main
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'pull_request' && github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.4'
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk

  frontend-unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.4'
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      run: flutter pub get
    
    # Add necessary script executions accordingly.
    - name: Run lecture fetch unit tests
      run: flutter test test/features/edit/lecture_fetch_test.dart

    - name: Run player unit tests
      run: flutter test test/features/player/

    - name: Run search screen unit tests
      run: flutter test test/features/search/search_screen_test.dart

    - name: Run home screen unit tests
      run: flutter test test/features/home/

  frontend-integration-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.4'
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      run: flutter pub get

    # Add necessary script executions accordingly.
    #- name: Run integration tests
    #  run: flutter test integration_test

  # Linter for Dart: warnings are treated as errors
  dart-linter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.4'
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Format check
      run: dart format --output=none --set-exit-if-changed .
    
    - name: Analyze
      run: flutter analyze --fatal-infos --fatal-warnings
